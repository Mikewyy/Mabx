<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/motion.js"></script>
  <link rel="stylesheet" href="/assets/css/admin.css">
  <title>Productos · Panel Mabx</title>
</head>
<body>
  <div class="admin">
    <div data-sidebar></div>
    <main class="admin-main">
      <div class="admin-head reveal reveal-fade">
        <div>
          <p class="kicker">Panel · Mabx</p>
          <h1>Productos</h1>
        </div>
        <a href="/admin/editar" class="btn btn-ac" id="new-btn"></a>
      </div>

      <div class="stats">
        <div class="stat reveal reveal-fade"><p class="lbl">Productos activos</p><p class="val" id="st-active">–</p></div>
        <div class="stat reveal reveal-fade"><p class="lbl">En oferta</p><p class="val accent" id="st-sale">–</p></div>
        <div class="stat reveal reveal-fade"><p class="lbl">Agotados</p><p class="val" id="st-out">–</p></div>
      </div>

      <div class="alert optimize" id="optimize" role="status" hidden>
        <div><strong>Hay <span id="opt-n">0</span> fotos sin optimizar.</strong> Conviértelas a WEBP para que pesen menos y la tienda cargue más rápido. No cambia cómo se ven.</div>
        <button type="button" class="btn btn-ac btn-sm" id="opt-btn">Optimizar fotos</button>
      </div>

      <div class="table-wrap reveal reveal-fade">
        <div class="table-tools">
          <label class="sr-only" for="q">Buscar producto</label>
          <input id="q" type="text" placeholder="Buscar por nombre…" autocomplete="off">
        </div>
        <table>
          <thead><tr>
            <th style="width:40%">Producto</th>
            <th>Categoría</th>
            <th>Precio</th>
            <th>Estado</th>
            <th style="text-align:right">Acciones</th>
          </tr></thead>
          <tbody id="rows"><tr><td colspan="5" class="muted">Cargando…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <script type="module">
    import { api, requireAdmin, renderSidebar, toast, esc, AICONS, uploadPhoto } from '/assets/js/admin.js';
    import { money, finalPrice, productImg } from '/assets/js/common.js';
    await requireAdmin();
    renderSidebar('productos');
    document.getElementById('new-btn').innerHTML = AICONS.plus() + ' Nuevo producto';

    let products = [], catNames = new Map();
    const rows = document.getElementById('rows');
    const q = document.getElementById('q');

    async function load() {
      const data = await api('/api/admin/catalog');
      products = data.products;
      catNames = new Map(data.categories.map((c) => [c.id, c.name]));
      render();
      checkOptimize();
    }

    function sizeRange(sizes) {
      if (!sizes.length) return 'Talla única';
      return sizes.length > 2 ? `Tallas ${sizes[0]}–${sizes[sizes.length - 1]}` : `Tallas ${sizes.join(', ')}`;
    }

    function render() {
      document.getElementById('st-active').textContent = products.filter((p) => p.available).length;
      document.getElementById('st-sale').textContent = products.filter((p) => p.available && p.sale_price != null).length;
      document.getElementById('st-out').textContent = products.filter((p) => !p.available).length;

      const term = q.value.trim().toLowerCase();
      const list = products.filter((p) => !term || p.name.toLowerCase().includes(term));
      if (!list.length) {
        rows.innerHTML = `<tr><td colspan="5" class="muted">${products.length ? 'Ningún producto coincide con la búsqueda.' : 'Aún no hay productos. Crea el primero con “Nuevo producto”.'}</td></tr>`;
        return;
      }
      rows.innerHTML = list.map((p) => {
        const off = !p.available;
        const status = off ? '<span class="badge off">Agotado</span>' : p.sale_price != null ? '<span class="badge ok">En oferta</span>' : '<span class="badge ok">Disponible</span>';
        const featLbl = p.featured ? 'Quitar de destacados' : 'Destacar';
        const availLbl = off ? 'Marcar disponible' : 'Marcar agotado';
        return `<tr${off ? ' class="is-off"' : ''}>
          <td class="c-prod"><a class="prod" href="/admin/editar?id=${p.id}">
            <div class="tdimg"><img src="${esc(productImg(p))}" alt=""></div>
            <div><p class="pname">${esc(p.name)}${p.featured ? ' <span class="accent" title="Destacado en el inicio">★</span>' : ''}</p>
            <p class="muted psub">${esc(sizeRange(p.sizes))}<span class="m-cat"> · ${esc(catNames.get(p.category_id) || 'Sin categoría')}</span></p></div>
          </a></td>
          <td class="c-cat muted">${esc(catNames.get(p.category_id) || '—')}</td>
          <td class="c-price"><span class="pprice">${money(finalPrice(p))}</span>${p.sale_price != null ? ` <span class="muted pold">${money(p.price)}</span>` : ''}</td>
          <td class="c-status">${status}</td>
          <td class="c-act"><div class="actions">
            <a class="iact wide" href="/admin/editar?id=${p.id}">${AICONS.edit}<span>Editar</span></a>
            <button class="iact" data-act="feat" data-id="${p.id}" aria-label="${featLbl}: ${esc(p.name)}" title="${featLbl}" ${p.featured ? 'style="color:var(--ac)"' : ''}>${AICONS.star(p.featured)}<span class="m-lbl">${p.featured ? 'No destacar' : 'Destacar'}</span></button>
            <button class="iact" data-act="avail" data-id="${p.id}" aria-label="${availLbl}: ${esc(p.name)}" title="${availLbl}">${off ? AICONS.restore : AICONS.ban}<span class="m-lbl">${off ? 'Disponible' : 'Agotado'}</span></button>
            <button class="iact danger" data-act="del" data-id="${p.id}" aria-label="Eliminar ${esc(p.name)}" title="Eliminar">${AICONS.trash}<span class="m-lbl">Eliminar</span></button>
          </div></td>
        </tr>`;
      }).join('');
    }

    rows.addEventListener('click', async (e) => {
      const b = e.target.closest('button[data-act]');
      if (!b) return;
      const p = products.find((x) => x.id === Number(b.dataset.id));
      b.disabled = true;
      try {
        if (b.dataset.act === 'avail') {
          Object.assign(p, await api(`/api/admin/products/${p.id}`, { method: 'PATCH', body: { available: !p.available } }));
          toast(p.available ? 'Marcado como disponible' : 'Marcado como agotado');
        } else if (b.dataset.act === 'feat') {
          Object.assign(p, await api(`/api/admin/products/${p.id}`, { method: 'PATCH', body: { featured: !p.featured } }));
          toast(p.featured ? 'Ahora aparece en Destacados' : 'Quitado de Destacados');
        } else if (b.dataset.act === 'del') {
          if (!confirm(`¿Eliminar "${p.name}"? Esta acción no se puede deshacer.`)) { b.disabled = false; return; }
          await api(`/api/admin/products/${p.id}`, { method: 'DELETE' });
          products = products.filter((x) => x.id !== p.id);
          toast('Producto eliminado');
        }
        render();
      } catch (ex) { toast(ex.message); b.disabled = false; }
    });
    q.addEventListener('input', render);

    // ---- Fotos subidas antes de la conversión automática a WEBP ----
    const needsWebp = (u) => u.startsWith('/media/') && !/\.webp$/i.test(u);
    const optBox = document.getElementById('optimize');
    const optBtn = document.getElementById('opt-btn');
    function checkOptimize() {
      const n = products.reduce((t, p) => t + p.images.filter(needsWebp).length, 0);
      document.getElementById('opt-n').textContent = n;
      optBox.hidden = n === 0;
    }
    optBtn.addEventListener('click', async () => {
      optBtn.disabled = true;
      let done = 0, failed = 0;
      const total = Number(document.getElementById('opt-n').textContent);
      for (const p of products) {
        if (!p.images.some(needsWebp)) continue;
        const images = [];
        for (const u of p.images) {
          if (!needsWebp(u)) { images.push(u); continue; }
          optBtn.textContent = `Optimizando ${done + failed + 1} de ${total}…`;
          try {
            const blob = await fetch(u).then((r) => { if (!r.ok) throw new Error(); return r.blob(); });
            images.push(await uploadPhoto(blob, u.split('/').pop()));
            done++;
          } catch { images.push(u); failed++; }
        }
        // Al guardar con las fotos nuevas, el servidor borra las originales que ya no se usan
        try { Object.assign(p, await api(`/api/admin/products/${p.id}`, { method: 'PUT', body: { ...p, images } })); }
        catch (ex) { toast(`${p.name}: ${ex.message}`); }
      }
      optBtn.disabled = false; optBtn.textContent = 'Optimizar fotos';
      toast(failed ? `${done} fotos optimizadas, ${failed} no se pudieron convertir` : `Listo: ${done} fotos optimizadas`);
      render(); checkOptimize();
    });
    load().catch((ex) => { rows.innerHTML = `<tr><td colspan="5" class="muted">${esc(ex.message)}</td></tr>`; });
  </script>
</body>
</html>
