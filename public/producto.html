<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Producto · Mabx</title>
  <meta name="description" content="Ropa deportiva Mabx: elige tu talla y pide por WhatsApp. Envíos a todo el Ecuador.">
  <meta name="theme-color" content="#0A0A0A">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/styles.css">
  <script src="/assets/js/motion.js"></script>
</head>
<body>
  <div data-header></div>
  <noscript><p class="noscript">Activa JavaScript en tu navegador para ver los productos y hacer tu pedido.</p></noscript>
  <main class="wrap pdp-page">
    <nav class="crumbs" aria-label="Ruta"><a href="/catalogo">Catálogo</a><span class="sep" aria-hidden="true">/</span><span id="crumb">…</span></nav>
    <div id="pdp"><div class="skeleton" style="min-height:520px"></div></div>
    <section id="related-wrap" class="related" hidden aria-labelledby="related-title">
      <div class="section-head reveal">
        <div>
          <p class="eyebrow">Completa tu equipo</p>
          <h2 id="related-title">También te puede gustar</h2>
        </div>
        <a href="/catalogo" class="link-ac">Ver catálogo <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
      <div class="grid" id="related"></div>
    </section>
  </main>
  <div data-footer></div>

  <script type="module">
    import { renderChrome, getCatalog, productCard, esc, money, finalPrice, discountPct, productImg, cart, toast, ICONS, errorBox, emblem, sizeOut } from '/assets/js/common.js';
    renderChrome('catalogo');
    const box = document.getElementById('pdp');
    const id = Number(new URLSearchParams(location.search).get('id'));
    const TRUCK = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h11v10h-11zM13.5 10h4l3.5 3.5v3h-7.5"/><circle cx="7" cy="17.5" r="1.8"/><circle cx="17" cy="17.5" r="1.8"/></svg>';

    let data;
    try { data = await getCatalog(); } catch { errorBox(box); throw new Error('catalog'); }
    const p = data.products.find((x) => x.id === id);
    if (!p) {
      document.getElementById('crumb').textContent = 'No encontrado';
      box.innerHTML = `<div class="empty-state">
          ${emblem(44)}
          <h1 class="nf-title">Producto no encontrado</h1>
          <p>Este producto ya no está disponible o el enlace está incompleto.</p>
          <a class="btn btn-ac btn-sm" href="/catalogo">Ver catálogo</a>
        </div>`;
    } else {
      render(p);
    }

    function render(p) {
      document.title = `${p.name} · Mabx`;
      if (p.description) document.querySelector('meta[name=description]').content = p.description.slice(0, 155);
      document.getElementById('crumb').textContent = p.name;
      const save = p.sale_price != null ? p.price - p.sale_price : 0;
      const imgs = p.images.length ? p.images : [productImg(p)];
      const inStockSizes = p.sizes.filter((s) => !sizeOut(p, s));
      let size = p.sizes.length === 1 && inStockSizes.length === 1 ? p.sizes[0] : null;
      let qty = 1;
      const badge = !p.available ? '<span class="tag out">Agotado</span>'
        : p.sale_price != null ? `<span class="tag">-${discountPct(p)}% · En oferta</span>`
        : p.is_new ? '<span class="tag alt">Nuevo</span>' : '';

      box.innerHTML = `
        <div class="pdp">
          <div class="gallery reveal">
            ${imgs.length > 1 ? `<div class="thumbs" role="group" aria-label="Fotos">${imgs.map((src, i) => `<button type="button" class="thumb${i ? '' : ' on'}" data-i="${i}" aria-label="Ver foto ${i + 1}" aria-pressed="${!i}"><img src="${esc(src)}" alt=""></button>`).join('')}</div>` : ''}
            <div class="main-img" id="zoom">
              <img id="main-img" src="${esc(imgs[0])}" alt="${esc(p.name)}">
              <span class="corner tl"></span><span class="corner tr"></span><span class="corner bl"></span><span class="corner br"></span>
              <span class="zoom-hint" aria-hidden="true">Pasa el cursor para ampliar</span>
            </div>
          </div>
          <div class="pdp-info reveal">
            ${badge}
            <h1>${esc(p.name)}</h1>
            <div class="pdp-price">
              <span class="price">${money(finalPrice(p))}</span>
              ${save ? `<span class="old">${money(p.price)}</span><span class="save">Ahorras ${money(save)}</span>` : ''}
            </div>
            ${p.description ? `<p class="pdp-desc">${esc(p.description)}</p>` : ''}
            ${p.sizes.length ? `
            <div class="pdp-block">
              <div class="pdp-label"><span id="size-lbl">Talla</span><span class="pdp-pick" id="size-pick">${size ? esc(size) : 'Elige una'}</span></div>
              <div class="chips" role="group" aria-labelledby="size-lbl" id="sizes">
                ${p.sizes.map((s) => `<button type="button" class="chip" aria-pressed="${s === size}" data-size="${esc(s)}"${sizeOut(p, s) ? ` disabled aria-label="Talla ${esc(s)}, agotada" title="Agotada"` : ''}>${esc(s)}</button>`).join('')}
              </div>
              <p class="form-hint" id="hint" hidden>Elige una talla para continuar.</p>
            </div>` : ''}
            <div class="pdp-block">
              <p class="pdp-label">Cantidad</p>
              <div class="buy-row">
                <div class="qty">
                  <button type="button" data-q="-1" aria-label="Disminuir">−</button>
                  <output id="qty" aria-live="polite">1</output>
                  <button type="button" data-q="1" aria-label="Aumentar">+</button>
                </div>
                <button type="button" class="btn btn-ac btn-lg add-btn" id="add"${p.available ? '' : ' disabled'}>
                  <span class="lbl lbl-idle">${ICONS.cart()} ${p.available ? 'Agregar al carrito' : 'Agotado'}</span>
                  <span class="lbl lbl-done" aria-hidden="true">${ICONS.check()} Agregado</span>
                </button>
              </div>
            </div>
            <ul class="perks">
              <li><span class="perk-ic sm">${TRUCK}</span><span>${esc(data.settings.shipping_info || 'Envíos a todo el Ecuador')}</span></li>
              <li><span class="perk-ic sm">${ICONS.whatsapp(18)}</span><span>Pago y coordinación por WhatsApp, sin crear cuentas.</span></li>
            </ul>
          </div>
        </div>`;

      const mainImg = document.getElementById('main-img');
      const zoom = document.getElementById('zoom');
      const addBtn = document.getElementById('add');
      const hint = document.getElementById('hint');

      // Cambio de foto con un fundido corto (precarga antes de mostrar)
      function showImage(i) {
        const src = imgs[i];
        if (mainImg.getAttribute('src') === src) return;
        mainImg.classList.add('swapping');
        const pre = new Image();
        pre.onload = pre.onerror = () => setTimeout(() => { mainImg.src = src; mainImg.classList.remove('swapping'); }, 120);
        pre.src = src;
      }

      // Zoom que sigue al cursor (solo con mouse; en celular no aplica)
      if (matchMedia('(hover: hover) and (pointer: fine)').matches) {
        zoom.addEventListener('pointerenter', () => zoom.classList.add('zooming'));
        zoom.addEventListener('pointerleave', () => zoom.classList.remove('zooming'));
        zoom.addEventListener('pointermove', (e) => {
          const r = zoom.getBoundingClientRect();
          mainImg.style.transformOrigin = `${((e.clientX - r.left) / r.width) * 100}% ${((e.clientY - r.top) / r.height) * 100}%`;
        });
      }

      let doneTimer;
      box.addEventListener('click', (e) => {
        const t = e.target.closest('button');
        if (!t) return;
        if (t.dataset.i) {
          box.querySelectorAll('.thumb').forEach((b) => { b.classList.toggle('on', b === t); b.setAttribute('aria-pressed', String(b === t)); });
          showImage(Number(t.dataset.i));
        } else if (t.dataset.size) {
          size = t.dataset.size;
          box.querySelectorAll('[data-size]').forEach((b) => b.setAttribute('aria-pressed', String(b === t)));
          document.getElementById('size-pick').textContent = size;
          hint.hidden = true;
        } else if (t.dataset.q) {
          qty = Math.min(99, Math.max(1, qty + Number(t.dataset.q)));
          document.getElementById('qty').textContent = qty;
        } else if (t.id === 'add') {
          if (p.sizes.length && !size) {
            hint.hidden = false;
            const group = document.getElementById('sizes');
            group.classList.remove('nope'); void group.offsetWidth; group.classList.add('nope');
            return;
          }
          cart.add(p.id, size || 'Única', qty);
          toast(`${ICONS.check(18)} Agregado al carrito <a href="/carrito">Ver carrito →</a>`);
          // El botón confirma con un check y vuelve a su estado tras un momento
          addBtn.classList.add('added');
          clearTimeout(doneTimer);
          doneTimer = setTimeout(() => addBtn.classList.remove('added'), 1600);
        }
      });

      const related = data.products
        .filter((x) => x.id !== p.id && x.available)
        .sort((a, b) => (b.category_id === p.category_id) - (a.category_id === p.category_id))
        .slice(0, 4);
      if (related.length) {
        document.getElementById('related').innerHTML = related.map((x) => productCard(x, { cta: false })).join('');
        document.getElementById('related-wrap').hidden = false;
      }
    }
  </script>
</body>
</html>
